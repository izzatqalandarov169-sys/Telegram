name: Build Android APK

on:
  push:
    branches: ["master", "superme-build-2026-08-16"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android NDK
        run: sdkmanager "ndk;27.2.12479018"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Apply SuperMe UI integration
        run: python3 scripts/apply_superme_customizations.py

      - name: Build APK
        run: ./gradlew :TMessagesProj_App:assembleAfatDebug --no-daemon --stacktrace

      - name: Locate APK
        run: find TMessagesProj_App/build/outputs/apk -type f -name '*.apk' -print

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuperMe-Telegram-debug
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
          if-no-files-found: error
